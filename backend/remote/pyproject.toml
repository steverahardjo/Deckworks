[project]
name = "remote"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Steve", email = "steve.jevon.r@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "email-validator>=2.3.0",
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "vercel-sandbox>=0.4.0",
]

[project.scripts]
remote = "remote:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
